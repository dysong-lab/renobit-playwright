name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub Pages 배포를 위해 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 여러 배포가 동시에 일어나지 않도록 큐(Queue) 처리
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      
    # 테스트가 실패하더라도 리포트는 보존하기 위해 !cancelled() 조건 사용
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        
    # main 브랜치일 때만 Pages 배포용 아티팩트 생성 준비
    - name: Setup Pages
      if: github.ref == 'refs/heads/main' && !cancelled()
      uses: actions/configure-pages@v4
      
    - name: Upload artifact for GitHub Pages
      if: github.ref == 'refs/heads/main' && !cancelled()
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/

  # GitHub Pages 배포 잡 (test 잡이 끝난 후 실행)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    # test가 성공하거나(실패하더라도 리포트는 보여줘야 하므로) main 브랜치일 때 실행
    if: github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
